name: Deploy site

# Builds the docs in triagedaemon/triaged (docs/ + mkdocs.yml) and publishes
# them at https://triagedaemon.github.io. The source of truth is the code repo;
# this repo only holds the build. A push to triaged's docs sends a docs-updated
# repository_dispatch when that repo has a SITE_DISPATCH_TOKEN secret; the hourly
# schedule is the fallback (GitHub can delay scheduled runs), and the Actions tab
# can run it on demand. triaged is private, so the checkout uses the
# TRIAGED_READ_TOKEN secret (see README).

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [docs-updated]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the docs source
        uses: actions/checkout@v4
        with:
          repository: triagedaemon/triaged
          path: src
          # triaged is private: a fine-grained token with read access to its contents.
          # Falls back to the workflow token, which can only read public repos.
          token: ${{ secrets.TRIAGED_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade "uv>=0.8,<0.12"
      - name: Install docs dependencies
        working-directory: src
        run: uv sync --locked --only-group docs
      - name: Build site
        working-directory: src
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --no-sync mkdocs build --strict --site-dir "$GITHUB_WORKSPACE/_site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
